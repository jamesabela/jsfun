<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printable activities | Paper 2 companion</title>
  <link rel="stylesheet" href="print.css">
  <script src="print.js" defer></script>
</head>
<body>
  <aside class="toolbar" aria-label="Print options">
    <a id="back" href="index.html">← Back to activities</a>
    <p>Print these student worksheets or choose <strong>Save as PDF</strong> in the print dialog. Use A4 paper and turn off browser headers and footers.</p>
    <label><input id="writing-space" type="checkbox" checked> Include space for written answers</label>
    <button id="print" type="button" disabled>Print / Save as PDF</button>
    <p id="status" role="status">Loading activities…</p>
    <noscript>Enable JavaScript to load the printable activities.</noscript>
  </aside>
  <main id="worksheets"></main>
</body>
</html>
