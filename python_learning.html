<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garden International Students</title>
  <style>
    :root {
      --bg: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --card: #ffffff;
      --border: #dbeafe;
      --green: #10b981;
      --blue: #2563eb;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(16, 185, 129, 0.2), transparent 34%),
        radial-gradient(circle at bottom right, rgba(37, 99, 235, 0.18), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
      padding: 42px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
      text-align: center;
      backdrop-filter: blur(16px);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: linear-gradient(135deg, var(--green), var(--blue));
      box-shadow: 0 16px 34px rgba(16, 185, 129, 0.28);
    }

    .icon svg {
      width: 38px;
      height: 38px;
      fill: currentColor;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.6;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
      padding: 13px 20px;
      border-radius: 999px;
      background: var(--text);
      color: #ffffff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 26px rgba(15, 23, 42, 0.2);
    }

    a:hover {
      transform: translateY(-1px);
    }

    a svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    @media (max-width: 520px) {
      main {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path
          d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 9.72L5.14 9 12 5.28 18.86 9 12 12.72zM6 13.18v3.1c0 2.18 3.58 3.72 6 3.72s6-1.54 6-3.72v-3.1l-6 3.27-6-3.27z" />
      </svg>
    </div>
    <h1>Garden International Students</h1>
    <p>Please use the Garden School interactive practicals site to access this Python learning content.</p>
    <a href="https://sites.google.com/gardenschool.edu.my/4practical/interactive">
      Open Garden Site
      <svg viewBox="0 0 24 24">
        <path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H7v10h10v-4h2v6H5V5z" />
      </svg>
    </a>
  </main>
<script data-goatcounter="https://jabela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>

</html>
