<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computing Tools — jsfun by James Abela</title>
  <meta name="description" content="A collection of free classroom tools for computing by James Abela.">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #1a6aff;
      --primary-dark: #0047cc;
      --primary-light: #e6f0ff;
      --text: #0d1b3e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #ffffff;
      --white: #ffffff;
      --radius: 0.75rem;
    }

    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ───── Hero Carousel ───── */
    .hero-carousel-container {
      max-width: 1024px;
      margin: 1.5rem auto 0.75rem;
      padding: 0 1rem;
    }

    .carousel-track-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1024 / 341;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(13, 27, 62, 0.12);
      border: 1px solid var(--border);
      background: #0d1b3e;
    }

    .carousel-slides {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out, transform 0.8s ease-out;
      transform: scale(1.02);
      display: block;
      text-decoration: none;
    }

    .carousel-slide.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      z-index: 2;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Carousel Arrow Controls */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 5;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(4px);
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--text);
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.25s, background 0.2s, transform 0.2s;
    }

    .carousel-track-wrapper:hover .carousel-arrow {
      opacity: 0.9;
    }

    .carousel-arrow:hover {
      background: var(--white);
      transform: translateY(-50%) scale(1.1);
      opacity: 1 !important;
    }

    .carousel-arrow.prev { left: 1rem; }
    .carousel-arrow.next { right: 1rem; }

    /* Indicator Dots */
    .carousel-dots {
      position: absolute;
      bottom: 0.85rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      display: flex;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      background: rgba(13, 27, 62, 0.45);
      backdrop-filter: blur(6px);
      border-radius: 999px;
    }

    .carousel-dots .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .carousel-dots .dot.active {
      width: 24px;
      background: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    /* ───── Tab bar (Navigation) ───── */
    .tab-bar-wrap {
      display: flex;
      justify-content: center;
      margin: 1.25rem auto 0;
      position: relative;
      z-index: 10;
    }

    .tab-bar {
      background: var(--white);
      border-radius: 999px;
      padding: 0.35rem;
      display: inline-flex;
      gap: 0.25rem;
      box-shadow: 0 4px 24px rgba(230, 57, 70, 0.15);
      border: 1px solid var(--border);
    }

    .tab-btn {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.6rem 1.6rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.35);
    }

    .tab-btn:hover:not(.active) {
      background: var(--primary-light);
      color: var(--primary);
    }

    .tab-btn.link-btn {
      background: transparent;
      color: #0d9488;
      border: 1.5px solid #0d9488;
    }

    .tab-btn.link-btn:hover {
      background: #ccfbf1;
      color: #0f766e;
      border-color: #0f766e;
    }

    /* ───── Main content ───── */
    main {
      max-width: 960px;
      margin: 2.5rem auto;
      padding: 0 1rem 4rem;
    }

    /* ───── Section heading (Summary) ───── */
    .section-heading {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 2.2rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--primary-light);
      cursor: pointer;
      list-style: none; /* Hide default chevron */
      position: relative;
    }
    
    .section-heading::-webkit-details-marker {
      display: none;
    }

    .section-heading:hover {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .section-heading .icon {
      font-size: 1.4rem;
    }

    .section-heading .chevron {
      margin-left: auto;
      width: 20px;
      height: 20px;
      position: relative;
      transition: transform 0.3s ease;
      opacity: 0.6;
    }

    .section-heading .chevron::before,
    .section-heading .chevron::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 10px;
      height: 2px;
      background-color: currentColor;
      border-radius: 2px;
    }

    .section-heading .chevron::before {
      left: 0;
      transform: rotate(45deg);
    }

    .section-heading .chevron::after {
      right: 0;
      transform: rotate(-45deg);
    }

    details[open] .section-heading .chevron {
      transform: rotate(180deg);
    }
    
    /* ───── Cards grid ───── */

    /* ───── Cards grid ───── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 1.1rem 1.3rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(230, 57, 70, 0.14);
      border-color: var(--primary);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-top: auto;
      padding-top: 0.5rem;
      flex-wrap: wrap;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15em 0.7em;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary-dark);
      align-self: flex-start;
    }

    .card-author {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 600;
    }

    .card-tutorial-btn {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: #fee2e2;
      color: #b91c1c;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: background 0.18s, transform 0.15s;
    }

    .card-tutorial-btn:hover {
      background: #fecaca;
      transform: scale(1.03);
    }

    .section-video-btn {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      background: #fee2e2;
      color: #b91c1c;
      text-decoration: none;
      margin-left: 0.75rem;
      vertical-align: middle;
      transition: background 0.18s;
    }

    .section-video-btn:hover {
      background: #fecaca;
    }

    /* External indicator */
    .card.external::after {
      content: '↗';
      position: absolute;
      top: 0.8rem;
      right: 1rem;
      font-size: 0.85rem;
      color: var(--muted);
      opacity: 0.5;
    }

    /* ───── Footer ───── */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--muted);
      max-width: 960px;
      margin: 0 auto;
    }

    footer a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    footer a.tea {
      color: #e73c7e;
    }

    /* ───── Filter bar ───── */
    .filter-bar-wrap {
      display: flex;
      justify-content: center;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      max-width: 960px;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      background: var(--white);
      color: var(--muted);
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.25);
    }

    .filter-btn:hover:not(.active) {
      background: var(--primary-light);
      border-color: var(--primary-light);
      color: var(--primary);
    }

    @media (max-width: 500px) {
      .hero {
        padding: 2.5rem 1rem 4rem;
      }

      .tab-btn {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      .filter-bar-wrap {
        margin-top: 1rem;
        gap: 0.4rem;
      }

      .filter-btn {
        padding: 0.35rem 0.8rem;
        font-size: 0.8rem;
      }
    }

    /* ───── Search Box ───── */
    .search-wrap {
      max-width: 500px;
      margin: 2rem auto 0;
      padding: 0 1rem;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 0.8rem 1rem 0.8rem 2.8rem;
      border-radius: 999px;
      border: 1.5px solid var(--border);
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s;
      outline: none;
      background: var(--white);
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.1), 0 0 0 4px var(--primary-light);
    }

    .search-input::placeholder {
      color: #9ca3af;
    }

    .search-icon {
      position: absolute;
      left: 2.1rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- Hero Banner Carousel -->
  <header class="hero-carousel-container" aria-label="Featured Computing Resources">
    <div class="carousel-track-wrapper">
      <div class="carousel-slides" id="heroCarouselSlides">
        <!-- Slide 1: Python Code Lab -->
        <a class="carousel-slide active" href="https://jamesabela.github.io/jsfun/pythoncopy" title="Python Code Lab — Interactive code editor, runner and visualizer">
          <img src="computing%20hero%20images/codelab.jpg" alt="Python Code Lab" width="1024" height="341">
        </a>
        <!-- Slide 2: Python Challenges -->
        <a class="carousel-slide" href="https://jamesabela.github.io/jsfun/challenge_list.html" title="Python Challenges — Interactive coding quests and drills">
          <img src="computing%20hero%20images/challenges.jpg" alt="Python Challenges" width="1024" height="341">
        </a>
        <!-- Slide 3: Python for iGCSE -->
        <a class="carousel-slide" href="https://www.amazon.com/dp/B086PNZFK5" target="_blank" rel="noopener noreferrer" title="Python for iGCSE on Amazon">
          <img src="computing%20hero%20images/igcse.jpg" alt="Python for iGCSE" width="1024" height="341">
        </a>
        <!-- Slide 4: 21st Century Problem Solving -->
        <a class="carousel-slide" href="https://www.amazon.com/dp/B0H4BCHRLH" target="_blank" rel="noopener noreferrer" title="21st Century Problem Solving on Amazon">
          <img src="computing%20hero%20images/probsolving.jpg" alt="21st Century Problem Solving" width="1024" height="341">
        </a>
      </div>

      <!-- Arrow Controls -->
      <button class="carousel-arrow prev" aria-label="Previous Slide" onclick="changeBannerSlide(-1)">&#10094;</button>
      <button class="carousel-arrow next" aria-label="Next Slide" onclick="changeBannerSlide(1)">&#10095;</button>

      <!-- Indicator Dots -->
      <div class="carousel-dots" id="carouselDots" role="tablist" aria-label="Banner slide navigation">
        <button class="dot active" aria-label="Slide 1: Python Code Lab" onclick="goToBannerSlide(0)"></button>
        <button class="dot" aria-label="Slide 2: Python Challenges" onclick="goToBannerSlide(1)"></button>
        <button class="dot" aria-label="Slide 3: Python for iGCSE" onclick="goToBannerSlide(2)"></button>
        <button class="dot" aria-label="Slide 4: 21st Century Problem Solving" onclick="goToBannerSlide(3)"></button>
      </div>
    </div>
  </header>

  <!-- Navigation -->
  <div class="tab-bar-wrap">
    <div class="tab-bar" role="tablist">
      <a href="index.html" class="tab-btn">🎓 General Teaching</a>
      <a href="computing.html" class="tab-btn active">💻 Computing Tools</a>
      <a class="tab-btn link-btn" href="https://jamesabela.github.io/reading/apps.html">📚 English Tools</a>
      <a class="tab-btn link-btn" href="https://readysetcompute.com/">🚀
        ReadySetCompute</a>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" class="search-input" placeholder="Search for computing tools (e.g. binary, sort, python)..." oninput="handleSearch(this.value)">
  </div>

  <!-- Filter bar -->
  <div class="filter-bar-wrap">
    <button class="filter-btn active" onclick="filterByTag('all', this)">All</button>
    <button class="filter-btn" onclick="filterByTag('Primary', this)">Primary</button>
    <button class="filter-btn" onclick="filterByTag('KS1', this)">KS1</button>
    <button class="filter-btn" onclick="filterByTag('KS2', this)">KS2</button>
    <button class="filter-btn" onclick="filterByTag('KS3', this)">KS3</button>
    <button class="filter-btn" onclick="filterByTag('iGCSE', this)">iGCSE</button>
    <button class="filter-btn" onclick="filterByTag('A-Level', this)">A-Level</button>
  </div>

  <main>
    <div id="tools-container">
      <!-- Tools will be rendered here dynamically from usefulresources.json -->
    </div>
  </main>

  <footer>
    <p>
      Made with ❤️ for better thinking. If it helped you, support the project.
      <a class="tea" href="https://wise.com/pay/me/jamesphilipj" target="_blank" rel="noopener">Buy me a tea</a>.
    </p>
    <p style="margin-top:0.5rem;font-size:0.85rem;">
      <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a> ©
      James Abela 2024
    </p>
  </footer>

  <script src="renderer.js"></script>
  <script>
    // Initialize tools from usefulresources.json for Computing
    window.addEventListener('DOMContentLoaded', () => {
      initTools('usefulresources.json', 'computing');
      initHeroCarousel();
    });

    // Gentle Cycling Hero Carousel
    let currentSlideIndex = 0;
    let carouselTimer = null;
    const slideInterval = 5500; // gentle 5.5s cycle

    function showSlide(index) {
      const slides = document.querySelectorAll('.carousel-slide');
      const dots = document.querySelectorAll('.carousel-dots .dot');
      if (!slides.length) return;

      if (index >= slides.length) currentSlideIndex = 0;
      else if (index < 0) currentSlideIndex = slides.length - 1;
      else currentSlideIndex = index;

      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentSlideIndex);
      });

      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentSlideIndex);
      });
    }

    function changeBannerSlide(step) {
      showSlide(currentSlideIndex + step);
      resetBannerTimer();
    }

    function goToBannerSlide(index) {
      showSlide(index);
      resetBannerTimer();
    }

    function startBannerTimer() {
      stopBannerTimer();
      carouselTimer = setInterval(() => {
        showSlide(currentSlideIndex + 1);
      }, slideInterval);
    }

    function stopBannerTimer() {
      if (carouselTimer) {
        clearInterval(carouselTimer);
        carouselTimer = null;
      }
    }

    function resetBannerTimer() {
      stopBannerTimer();
      startBannerTimer();
    }

    function initHeroCarousel() {
      const carouselWrapper = document.querySelector('.carousel-track-wrapper');
      if (carouselWrapper) {
        // Pause on mouse hover for easy clicking
        carouselWrapper.addEventListener('mouseenter', stopBannerTimer);
        carouselWrapper.addEventListener('mouseleave', startBannerTimer);

        // Mobile touch swipe support
        let touchStartX = 0;
        carouselWrapper.addEventListener('touchstart', (e) => {
          touchStartX = e.changedTouches[0].screenX;
          stopBannerTimer();
        }, { passive: true });

        carouselWrapper.addEventListener('touchend', (e) => {
          const touchEndX = e.changedTouches[0].screenX;
          const diffX = touchEndX - touchStartX;
          if (Math.abs(diffX) > 40) {
            changeBannerSlide(diffX > 0 ? -1 : 1);
          } else {
            startBannerTimer();
          }
        }, { passive: true });
      }

      startBannerTimer();
    }
  </script>

  <script data-goatcounter="https://jabela.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
